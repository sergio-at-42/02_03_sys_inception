name: inception

services:

  42-nginx:
    build: requirements/nginx
    pull_policy: build
    volumes:
      - type: volume
        source: wp_data
        target: /data
    networks:
      - web_net
      - intra_net
    ports:
      - 443:443
    restart: always
    depends_on:
      - 42-wordpress

  42-wordpress:
    build: requirements/wordpress
    image: 42-wordpress
    pull_policy: build
    volumes:
      - type: volume
        source: wp_data
        target: /data
    networks:
      - intra_net
    env_file: .env
    secrets:
      - wp_admin_password
      - db_wp_password
    restart: always
    depends_on:
      - 42-mariadb

  42-mariadb:
    build:
      context: requirements/mariadb
    image: 42-mariadb
    pull_policy: build
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/mysql/
    networks:
      - intra_net
    env_file: .env
    secrets:
      - db_wp_password
      - db_root_password
    restart: always

networks:
  web_net:
  intra_net:

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sbeldjao/data/wp_data
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sbeldjao/data/db_data

secrets:
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  db_wp_password:
    file: ../secrets/db_wp_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
