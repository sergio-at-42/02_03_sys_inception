name: inception

services:

  nginx:
    image: 42-nginx
    volumes:
      - type: volume
        source: wp-data
        target: /data
    networks:
      - web-net
      - intra-net
    ports:
      - 8000:8000
    depends_on:
      - wp-php

  wp-php:
    image: 42-wp-php
    volumes:
      - type: volume
        source: wp-data
        target: /data
    networks:
      - intra-net
    depends_on:
      - mariadb

  mariadb:
    image: 42-mariadb
    volumes:
      - type: volume
        source: db-data
        target: /data
    networks:
      - intra-net
    environment:
       MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
       MYSQL_PASSWORD_FILE: /run/secrets/db_password
      #  MYSQL_DATABASE: wordpress
      #  MYSQL_USER: wordpress
    secrets:
      - db_password
      - db_root_password

networks:
  web-net:
  intra-net:

volumes:
  wp-data:
  db-data:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
