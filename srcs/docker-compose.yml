name: inception

services:

  nginx:
    image: 42-nginx
    volumes:
      - type: volume
        source: wp-data
        target: /data
    networks:
      - web-net
      - intra-net
    ports:
      - 8000:80
#    depends_on:
#      - backend

  mariadb:
    image: 42-mariadb
    volumes:
      - type: volume
        source: db-data
        target: /data
    networks:
      - intra-net

networks:
  web-net:
  intra-net:

volumes:
  wp-data:
  db-data:
