name: inception

services:

  nginx:
    image: 42-nginx
    volumes:
      - type: volume
        source: wp_data
        target: /data
    networks:
      - web_net
      - intra_net
    ports:
      - 8000:8000
    depends_on:
      - wp-php

  wp-php:
    image: 42-wp-php
    volumes:
      - type: volume
        source: wp_data
        target: /data
    networks:
      - intra_net
    depends_on:
      - mariadb

  mariadb:
    image: 42-mariadb
    volumes:
      - type: volume
        source: db_data
        target: /data
    networks:
      - intra_net
    environment:
       MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
       MYSQL_PASSWORD_FILE: /run/secrets/db_password
       MYSQL_DATABASE: wordpress
       MYSQL_USER: wordpress
    secrets:
      - db_password
      - db_root_password

networks:
  web_net:
  intra_net:

volumes:
  wp_data:
    driver_opts:
      device: /home/sbeldjao/data/wp_data
  db_data:
    driver_opts:
      device: /home/sbeldjao/data/db_data

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
